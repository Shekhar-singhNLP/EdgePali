version: '3.8'

services:
  backend:
    image: yourusername/edgepali-backend:latest
    ports:
      - "8000:8000"
    environment:
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    image: yourusername/edgepali-frontend:latest
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  huggingface_cache:
